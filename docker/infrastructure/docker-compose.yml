services:
  rabbitmq:
    image: masstransit/rabbitmq:4.3.1
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  jaeger:
    image: ${REGISTRY:-}jaegertracing/jaeger:2.22.0
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=debug

  promtail:
    image: grafana/promtail:3.6.11
    container_name: promtail
    volumes:
      - ./promtail/promtail.yaml:/etc/promtail/docker-config.yaml:ro
      - ./promtail/log:/var/log
    depends_on:
      - loki

  loki:
    image: grafana/loki:3.6.17
    container_name: loki
    ports:
      - 3100:3100
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yaml
      - loki-data:/tmp/loki

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    volumes:
      - ./prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules/blackbox-exporter.yml:/etc/prometheus/blackbox-exporter.yml
      - ./prometheus/rules/embedded-exporter.yml:/etc/prometheus/embedded-exporter.yml
      - ./prometheus/rules/google-cadvisor.yml:/etc/prometheus/google-cadvisor.yml
      - ./prometheus/rules/jaeger-v2.yml:/etc/prometheus/jaeger-v2.yml
      - ./prometheus/rules/node-exporter.yml:/etc/prometheus/node-exporter.yml
      - ./prometheus/rules/rules-example.yml:/etc/prometheus/rules-example.yml
    healthcheck:
      test: wget -q --tries=1 -O- http://localhost:9090/-/ready
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - 9090:9090
    depends_on:
      - cadvisor

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    ports:
      - 8080:8080
    command:
      - "--port=8080"
      - "--housekeeping_interval=30s"
      - "--docker_only=true"
      - "--disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    healthcheck:
      test: wget -q --tries=1 -O- http://localhost:8080/healthz || exit 1
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    ports:
      - 9100:9100

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.0
    container_name: blackbox-exporter
    ports:
      - 9115:9115
    volumes:
      - ./blackbox:/config
    command:
      - "--config.file=/config/blackbox.yml"

  speedtest-exporter:
    image: miguelndecarvalho/speedtest-exporter:v3.5.4
    container_name: speedtest-exporter
    ports:
      - 9798:9798

  alert-manager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    volumes:
      - ./prometheus/config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - 9093:9093

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_healthy
      cadvisor:
        condition: service_healthy
    volumes:
      - grafana-storage:/var/lib/grafana

  mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: mailpit
    # volumes:
    #   - ./data:/data
    ports:
      - 8025:8025
    environment:
      MP_ENABLE_PROMETHEUS: True
      MP_MAX_MESSAGES: 5000
      # MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  seq:
    image: datalust/seq:2026.1.17182
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=P@ssw0rd1!
    ports:
      - 5341:5341
      - 3110:80

  openbao-1-data-init:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "chown -R 100:1000 /openbao-data"]
    volumes:
      - openbao-1-data:/openbao-data
    restart: "no"

  openbao-1-audit-init:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "chown -R 100:1000 /openbao/audit"]
    volumes:
      - openbao-1-audit:/openbao/audit
    restart: "no"

  openbao-2-audit-init:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "chown -R 100:1000 /openbao/audit"]
    volumes:
      - openbao-2-audit:/openbao/audit
    restart: "no"

  openbao-3-audit-init:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "chown -R 100:1000 /openbao/audit"]
    volumes:
      - openbao-3-audit:/openbao/audit
    restart: "no"

  openbao-1:
    image: openbao/openbao:2.7.1
    container_name: openbao-1
    mem_swappiness: 0
    command: ["server", "-config=/openbao/config.hcl"]
    cap_add:
      - IPC_LOCK
    depends_on:
      openbao-1-data-init:
        condition: service_completed_successfully
      openbao-1-audit-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./openbao/node-1.hcl:/openbao/config.hcl:ro
      - ./openbao/tls/ca.crt:/openbao/tls/ca.crt:ro
      - ./openbao/tls/node-1.crt:/openbao/tls/server.crt:ro
      - ./openbao/tls/node-1.key:/openbao/tls/server.key:ro
      - openbao-1-data:/openbao/data
      - openbao-1-audit:/openbao/audit
    restart: unless-stopped

  openbao-2-data-init:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "chown -R 100:1000 /openbao-data"]
    volumes:
      - openbao-2-data:/openbao-data
    restart: "no"

  openbao-2:
    image: openbao/openbao:2.7.1
    container_name: openbao-2
    mem_swappiness: 0
    command: ["server", "-config=/openbao/config.hcl"]
    cap_add:
      - IPC_LOCK
    depends_on:
      openbao-1:
        condition: service_started
      openbao-2-data-init:
        condition: service_completed_successfully
      openbao-2-audit-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8202:8200"
    volumes:
      - ./openbao/node-2.hcl:/openbao/config.hcl:ro
      - ./openbao/tls/ca.crt:/openbao/tls/ca.crt:ro
      - ./openbao/tls/node-2.crt:/openbao/tls/server.crt:ro
      - ./openbao/tls/node-2.key:/openbao/tls/server.key:ro
      - openbao-2-data:/openbao/data
      - openbao-2-audit:/openbao/audit
    restart: unless-stopped

  openbao-3-data-init:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "chown -R 100:1000 /openbao-data"]
    volumes:
      - openbao-3-data:/openbao-data
    restart: "no"

  openbao-3:
    image: openbao/openbao:2.7.1
    container_name: openbao-3
    mem_swappiness: 0
    command: ["server", "-config=/openbao/config.hcl"]
    cap_add:
      - IPC_LOCK
    depends_on:
      openbao-1:
        condition: service_started
      openbao-3-data-init:
        condition: service_completed_successfully
      openbao-3-audit-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8204:8200"
    volumes:
      - ./openbao/node-3.hcl:/openbao/config.hcl:ro
      - ./openbao/tls/ca.crt:/openbao/tls/ca.crt:ro
      - ./openbao/tls/node-3.crt:/openbao/tls/server.crt:ro
      - ./openbao/tls/node-3.key:/openbao/tls/server.key:ro
      - openbao-3-data:/openbao/data
      - openbao-3-audit:/openbao/audit
    restart: unless-stopped

  mongodb:
    image: mongo:9.0.2
    container_name: mongodb
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db

  mssql:
    image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04
    container_name: mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-}
    ports:
      - "1433:1433"
    volumes:
      - sqlvolume:/var/opt/mssql

  nginx:
    image: nginx:1.30.5
    container_name: nginx
    ports:
      - 9080:80 # Expose Nginx on port 9080
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf # Nginx configuration file
    depends_on:
      - prometheus

  redis:
    image: redis:8.10.2
    container_name: redis
    ports:
      - "6379:6379"

volumes:
  grafana-storage:
    external: true
  mongo-data:
  sqlvolume:
  loki-data:
  openbao-1-data:
  openbao-2-data:
  openbao-3-data:
  openbao-1-audit:
  openbao-2-audit:
  openbao-3-audit:
